<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One ray vs two rays</title>
<style>
:root{--text-primary:#18202B;--text-secondary:#5B6573;--text-success:#0F6E56;--surface-1:#EDF0F3;--surface-2:#E2E6EB;
--border-subtle:rgba(24,32,43,.12);--border-strong:rgba(24,32,43,.30);--radius:8px;--radius-lg:12px;
--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--text-primary:#E6EAF0;--text-secondary:#9AA4B2;--text-success:#5DCAA5;
--surface-1:#1E2631;--surface-2:#27303C;--border-subtle:rgba(230,234,240,.12);--border-strong:rgba(230,234,240,.32);color-scheme:dark}}
html,body{margin:0;background:transparent}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text-primary);padding:4px 2px;overflow-x:auto}
p{margin:0 0 6px}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border-subtle);
background:transparent;color:var(--text-primary);cursor:pointer}
button:hover{background:var(--surface-1)}
button:focus-visible,input:focus-visible{outline:2px solid #2F6FDE;outline-offset:2px}
input[type=range]{accent-color:#2F6FDE}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg text{font-family:inherit}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.ts{font-size:12px;fill:var(--text-secondary)}
.c-purple,.c-purple rect,.c-purple polygon{fill:#EEEDFE;stroke:#534AB7}
.c-purple text{fill:#3C3489;stroke:none}
.c-coral,.c-coral rect{fill:#FAECE7;stroke:#993C1D}
.c-coral text{fill:#712B13;stroke:none}
@media (prefers-color-scheme:dark){
.c-purple,.c-purple rect,.c-purple polygon{fill:#3C3489;stroke:#AFA9EC}
.c-purple text{fill:#EEEDFE}
.c-coral,.c-coral rect{fill:#712B13;stroke:#F0997B}
.c-coral text{fill:#FAECE7}}
</style></head>
<body>
<svg width="100%" viewBox="0 0 680 300" role="img">
<title>One camera gives a ray, two cameras give a point</title>
<desc>Left: a single camera projects a pixel back into a ray; the 3D point could be anywhere along it. Right: two cameras separated by baseline b each cast a ray; the rays intersect at the exact 3D point P.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="175" y="28" text-anchor="middle">One camera</text>
<text class="ts" x="175" y="48" text-anchor="middle">only a ray, depth unknown</text>
<line x1="175" y1="262" x2="232" y2="72" stroke="#888780" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
<line x1="135" y1="230" x2="215" y2="230" stroke="#5F5E5A" stroke-width="3"/>
<circle cx="184" cy="230" r="4.5" fill="#378ADD"/>
<polygon points="175,262 163,278 187,278" fill="#5F5E5A"/>
<circle cx="201" cy="170" r="7" fill="none" stroke="#888780" stroke-width="2"/>
<circle cx="218" cy="110" r="7" fill="none" stroke="#888780" stroke-width="2"/>
<circle cx="227" cy="80" r="7" fill="none" stroke="#888780" stroke-width="2"/>
<text class="th" x="214" y="175">?</text>
<text class="th" x="231" y="115">?</text>
<text class="th" x="240" y="85">?</text>
<text class="ts" x="128" y="222" text-anchor="end">pixel</text>
<line x1="340" y1="20" x2="340" y2="290" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="510" y="28" text-anchor="middle">Two cameras</text>
<text class="ts" x="510" y="48" text-anchor="middle">rays intersect, exact 3D point</text>
<line x1="430" y1="262" x2="510" y2="70" stroke="#378ADD" stroke-width="2.2"/>
<line x1="590" y1="262" x2="510" y2="70" stroke="#D85A30" stroke-width="2.2"/>
<line x1="395" y1="230" x2="465" y2="230" stroke="#5F5E5A" stroke-width="3"/>
<line x1="555" y1="230" x2="625" y2="230" stroke="#5F5E5A" stroke-width="3"/>
<circle cx="443" cy="230" r="4.5" fill="#378ADD"/>
<circle cx="577" cy="230" r="4.5" fill="#D85A30"/>
<polygon points="430,262 418,278 442,278" fill="#378ADD"/>
<polygon points="590,262 578,278 602,278" fill="#D85A30"/>
<circle cx="510" cy="70" r="8" fill="#639922"/>
<text class="th" x="524" y="75">P (x, y, z)</text>
<line x1="430" y1="288" x2="590" y2="288" stroke="#5F5E5A" stroke-width="1"/>
<line x1="430" y1="283" x2="430" y2="293" stroke="#5F5E5A" stroke-width="1"/>
<line x1="590" y1="283" x2="590" y2="293" stroke="#5F5E5A" stroke-width="1"/>
<text class="ts" x="510" y="278" text-anchor="middle">baseline b</text>
<text class="ts" x="388" y="222" text-anchor="end">left</text>
<text class="ts" x="632" y="222">right</text>
</svg>

<script>
(function(){function post(){parent.postMessage({cvNotesHeight:document.documentElement.scrollHeight},'*')}
addEventListener('load',post);if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);setTimeout(post,300);})();
</script>
</body></html>
