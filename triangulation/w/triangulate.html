<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From a matched pair to a 3D point</title>
<link rel="stylesheet" href="../../assets/katex/katex.min.css">
<script src="../../assets/katex/katex.min.js"></script>
<style>
:root{--ink:#18202B;--muted:#5B6573;--rule:rgba(24,32,43,.12);--surface:#EDF0F3;--l:#2F6FDE;--r:#E8692E;--win:#1D9E75;--warn:#B7791F;
--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#E6EAF0;--muted:#9AA4B2;--rule:rgba(230,234,240,.14);--surface:#1E2631;--l:#5B8FEA;--r:#F08A55;--win:#5DCAA5;--warn:#E0B062;color-scheme:dark}}
html,body{margin:0;background:transparent}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);padding:2px}
button{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
button:hover{background:var(--surface)}button.on{border-color:var(--ink);font-weight:600}
button:focus-visible,input:focus-visible{outline:2px solid var(--l);outline-offset:2px}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 7px;border-radius:999px;margin-right:6px;color:#fff;vertical-align:1px}
.tag.in{background:var(--l)}.tag.out{background:var(--win)}
.head{font-size:13px;font-weight:600;margin:0 0 6px;display:flex;align-items:center}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}
.grp h3{margin:0 0 4px;font-size:13px;font-weight:600}
.L h3{color:var(--l)}.R h3{color:var(--r)}
.L input{accent-color:var(--l)}.R input{accent-color:var(--r)}
input[type=range]{width:100%;margin:0}
.row{display:grid;grid-template-columns:30px 1fr 36px;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.row output{font-family:var(--font-mono);font-size:13px;color:var(--ink);text-align:right;font-weight:600}
.pre{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.ways{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:12px;margin-top:14px}
.card{border:1px solid var(--rule);border-radius:10px;padding:8px 12px;overflow-x:auto}
.card .head{color:var(--muted)}
.card .katex-display{margin:6px 0}
.out{margin-top:12px;padding:10px 14px;border-left:4px solid var(--win);background:var(--surface);border-radius:0 10px 10px 0;overflow-x:auto}
.out .katex{font-size:1.2em}.out .katex-display{margin:4px 0}
.note{font-size:13px;margin:4px 0 0}.note.ok{color:var(--win)}.note.bad{color:var(--warn)}
@media (max-width:700px){.ways{grid-template-columns:1fr}}
@media (max-width:560px){.ctl{grid-template-columns:1fr}.card .katex,.out .katex{font-size:.9em}}
</style></head>
<body>
<p class="head"><span class="tag in">in</span>matched pixels</p>
<div class="ctl">
<div class="grp L"><h3>Left image</h3><div id="cL"></div></div>
<div class="grp R"><h3>Right image</h3><div id="cR"></div></div>
</div>
<div class="pre"><button data-p="400,300,388,300">exact match</button><button data-p="400,301,388,299">1 px error in v</button><button data-p="401,300,388,300">1 px error in u</button></div>
<div class="ways">
<div class="card"><p class="head">A · simple formulas</p><div id="a"></div></div>
<div class="card"><p class="head">B · least squares</p><div id="b"></div></div>
</div>
<div class="out"><p class="head"><span class="tag out">out</span>3D point</p><div id="o"></div><p class="note" id="note"></p></div>
<script>
const f=700,ox=320,oy=240,B=0.12;
const M=[[f,0,ox,0],[0,f,oy,0],[0,0,1,0]],P=[[f,0,ox,f*B],[0,f,oy,0],[0,0,1,0]];
const S={ul:400,vl:300,ur:388,vr:300};
const $=id=>document.getElementById(id),all=[];
function add(p,k,lab,min,max){const d=document.createElement('div');d.className='row';
d.innerHTML=`<span>${lab}</span><input type="range" min="${min}" max="${max}" step="1" value="${S[k]}" aria-label="${lab}"><output></output>`;
const i=d.querySelector('input');i.addEventListener('input',()=>{S[k]=+i.value;update()});
d.sync=()=>{i.value=S[k];d.querySelector('output').textContent=S[k]};$(p).appendChild(d);all.push(d)}
add('cL','ul','u_l',340,460);add('cL','vl','v_l',260,340);add('cR','ur','u_r',330,450);add('cR','vr','v_r',260,340);
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{[S.ul,S.vl,S.ur,S.vr]=b.dataset.p.split(',').map(Number);update()});
const K=(t,el)=>katex.render(t,el,{displayMode:true,throwOnError:false});
const g=v=>{const r=Math.round(v*100)/100;return Object.is(r,-0)?'0':String(r)},m2=v=>v.toFixed(2);
const row=(u,m,i)=>[0,1,2].map(j=>u*m[2][j]-m[i][j]),rhs=(u,m,i)=>m[i][3]-u*m[2][3];
function solve3(A,b){const m=A.map((r,i)=>[...r,b[i]]);for(let c=0;c<3;c++){let p=c;for(let r=c+1;r<3;r++)if(Math.abs(m[r][c])>Math.abs(m[p][c]))p=r;[m[c],m[p]]=[m[p],m[c]];
for(let r=0;r<3;r++)if(r!==c){const k=m[r][c]/m[c][c];for(let j=c;j<4;j++)m[r][j]-=k*m[c][j]}}return m.map((r,i)=>r[3]/r[i])}
function update(){all.forEach(d=>d.sync());
document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===[S.ul,S.vl,S.ur,S.vr].join(',')));
const d=S.ul-S.ur,n=$('note');
if(d<=0){['a','b','o'].forEach(id=>$(id).textContent='');n.className='note bad';n.textContent=`u_l − u_r = ${d}: the disparity must be positive, otherwise the rays meet behind the cameras.`;return}
// A · simple formulas (R = I, t = (b,0,0))
const z=f*B/d,x=z*(S.ur-ox)/f,y=z*(S.vr-oy)/f;
K(`\\begin{aligned}z_r &= \\frac{700\\cdot 0.12}{${S.ul} - ${S.ur}} = \\frac{84}{${d}} = \\mathbf{${m2(z)}}\\\\[4pt]
x_r &= \\frac{${m2(z)}\\,(${S.ur} - 320)}{700} = \\mathbf{${m2(x)}}\\\\[4pt]
y_r &= \\frac{${m2(z)}\\,(${S.vr} - 240)}{700} = \\mathbf{${m2(y)}}\\end{aligned}`,$('a'));
// B · least squares
const A=[row(S.ur,M,0),row(S.vr,M,1),row(S.ul,P,0),row(S.vl,P,1)],b=[rhs(S.ur,M,0),rhs(S.vr,M,1),rhs(S.ul,P,0),rhs(S.vl,P,1)];
const AtA=[0,1,2].map(i=>[0,1,2].map(j=>A.reduce((s,r)=>s+r[i]*r[j],0))),Atb=[0,1,2].map(i=>A.reduce((s,r,k)=>s+r[i]*b[k],0));
const X=solve3(AtA,Atb),rn=Math.hypot(...A.map((r,k)=>r[0]*X[0]+r[1]*X[1]+r[2]*X[2]-b[k]));
K(`\\underbrace{\\begin{bmatrix}${A.map(r=>r.map(g).join(' & ')).join('\\\\')}\\end{bmatrix}}_{A}
\\begin{bmatrix}x_r\\\\ y_r\\\\ z_r\\end{bmatrix} = \\underbrace{\\begin{bmatrix}${b.map(g).join('\\\\')}\\end{bmatrix}}_{\\mathbf b}
\\;\\Longrightarrow\\; \\begin{bmatrix}\\mathbf{${m2(X[0])}}\\\\ \\mathbf{${m2(X[1])}}\\\\ \\mathbf{${m2(X[2])}}\\end{bmatrix}`,$('b'));
const same=rn<1e-6;
K(same?`\\mathbf x_r = (${m2(X[0])},\\ ${m2(X[1])},\\ ${m2(X[2])})\\text{ m} \\qquad z_r = \\boxed{\\mathbf{${m2(X[2])}\\text{ m}}}`
:`\\text{A: } z_r = ${m2(z)}\\text{ m} \\qquad \\text{B: } z_r = \\boxed{\\mathbf{${m2(X[2])}\\text{ m}}}`,$('o'));
n.className='note '+(same?'ok':'bad');
n.textContent=same?`A = B: the two rays meet exactly. Here 1 px of disparity is worth ${(100*(84/d-84/(d+1))).toFixed(0)} cm of depth.`
:`v_l ≠ v_r: the rays miss each other (‖Ax − b‖ = ${rn.toFixed(2)}). Formula A ignores v_l; least squares B uses all 4 numbers and lands ${Math.abs(100*(X[2]-z)).toFixed(0)} cm away.`}
update();
</script>
<script>
(function(){function post(){parent.postMessage({cvNotesHeight:Math.ceil(document.body.getBoundingClientRect().height)+8},'*')}
addEventListener('load',post);if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);setTimeout(post,300);})();
</script>
</body></html>
