<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The matching window</title>
<style>
:root{--text-primary:#18202B;--text-secondary:#5B6573;--text-success:#0F6E56;--surface-1:#EDF0F3;--surface-2:#E2E6EB;
--border-subtle:rgba(24,32,43,.12);--border-strong:rgba(24,32,43,.30);--radius:8px;--radius-lg:12px;
--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--text-primary:#E6EAF0;--text-secondary:#9AA4B2;--text-success:#5DCAA5;
--surface-1:#1E2631;--surface-2:#27303C;--border-subtle:rgba(230,234,240,.12);--border-strong:rgba(230,234,240,.32);color-scheme:dark}}
html,body{margin:0;background:transparent}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text-primary);padding:4px 2px;overflow-x:auto}
p{margin:0 0 6px}
button{font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--radius);border:1px solid var(--border-subtle);
background:transparent;color:var(--text-primary);cursor:pointer}
button:hover{background:var(--surface-1)}
button:focus-visible,input:focus-visible{outline:2px solid #2F6FDE;outline-offset:2px}
input[type=range]{accent-color:#2F6FDE}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg text{font-family:inherit}
.th{font-size:14px;font-weight:500;fill:var(--text-primary)}
.ts{font-size:12px;fill:var(--text-secondary)}
.c-purple,.c-purple rect,.c-purple polygon{fill:#EEEDFE;stroke:#534AB7}
.c-purple text{fill:#3C3489;stroke:none}
.c-coral,.c-coral rect{fill:#FAECE7;stroke:#993C1D}
.c-coral text{fill:#712B13;stroke:none}
@media (prefers-color-scheme:dark){
.c-purple,.c-purple rect,.c-purple polygon{fill:#3C3489;stroke:#AFA9EC}
.c-purple text{fill:#EEEDFE}
.c-coral,.c-coral rect{fill:#712B13;stroke:#F0997B}
.c-coral text{fill:#FAECE7}}
</style></head>
<body>
<svg width="100%" viewBox="0 0 680 300" role="img">
<title>A matching window around a pixel</title>
<desc>A 7 by 7 pixel grid with one centre pixel highlighted. A 3 by 3 window around it collects 9 brightness values, which together form a fingerprint describing the centre pixel.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="145" y="28" text-anchor="middle">left image (pixels)</text>
<g stroke="#ffffff" stroke-width="1">
<rect x="40" y="40" width="30" height="30" fill="#D3D1C7"/><rect x="70" y="40" width="30" height="30" fill="#B4B2A9"/><rect x="100" y="40" width="30" height="30" fill="#F1EFE8"/><rect x="130" y="40" width="30" height="30" fill="#888780"/><rect x="160" y="40" width="30" height="30" fill="#D3D1C7"/><rect x="190" y="40" width="30" height="30" fill="#B4B2A9"/><rect x="220" y="40" width="30" height="30" fill="#F1EFE8"/>
<rect x="40" y="70" width="30" height="30" fill="#888780"/><rect x="70" y="70" width="30" height="30" fill="#F1EFE8"/><rect x="100" y="70" width="30" height="30" fill="#D3D1C7"/><rect x="130" y="70" width="30" height="30" fill="#B4B2A9"/><rect x="160" y="70" width="30" height="30" fill="#5F5E5A"/><rect x="190" y="70" width="30" height="30" fill="#D3D1C7"/><rect x="220" y="70" width="30" height="30" fill="#888780"/>
<rect x="40" y="100" width="30" height="30" fill="#F1EFE8"/><rect x="70" y="100" width="30" height="30" fill="#B4B2A9"/><rect x="100" y="100" width="30" height="30" fill="#888780"/><rect x="130" y="100" width="30" height="30" fill="#D3D1C7"/><rect x="160" y="100" width="30" height="30" fill="#5F5E5A"/><rect x="190" y="100" width="30" height="30" fill="#F1EFE8"/><rect x="220" y="100" width="30" height="30" fill="#B4B2A9"/>
<rect x="40" y="130" width="30" height="30" fill="#B4B2A9"/><rect x="70" y="130" width="30" height="30" fill="#D3D1C7"/><rect x="100" y="130" width="30" height="30" fill="#F1EFE8"/><rect x="130" y="130" width="30" height="30" fill="#444441"/><rect x="160" y="130" width="30" height="30" fill="#B4B2A9"/><rect x="190" y="130" width="30" height="30" fill="#888780"/><rect x="220" y="130" width="30" height="30" fill="#D3D1C7"/>
<rect x="40" y="160" width="30" height="30" fill="#D3D1C7"/><rect x="70" y="160" width="30" height="30" fill="#888780"/><rect x="100" y="160" width="30" height="30" fill="#B4B2A9"/><rect x="130" y="160" width="30" height="30" fill="#F1EFE8"/><rect x="160" y="160" width="30" height="30" fill="#888780"/><rect x="190" y="160" width="30" height="30" fill="#D3D1C7"/><rect x="220" y="160" width="30" height="30" fill="#F1EFE8"/>
<rect x="40" y="190" width="30" height="30" fill="#F1EFE8"/><rect x="70" y="190" width="30" height="30" fill="#D3D1C7"/><rect x="100" y="190" width="30" height="30" fill="#888780"/><rect x="130" y="190" width="30" height="30" fill="#B4B2A9"/><rect x="160" y="190" width="30" height="30" fill="#D3D1C7"/><rect x="190" y="190" width="30" height="30" fill="#5F5E5A"/><rect x="220" y="190" width="30" height="30" fill="#B4B2A9"/>
<rect x="40" y="220" width="30" height="30" fill="#B4B2A9"/><rect x="70" y="220" width="30" height="30" fill="#F1EFE8"/><rect x="100" y="220" width="30" height="30" fill="#D3D1C7"/><rect x="130" y="220" width="30" height="30" fill="#888780"/><rect x="160" y="220" width="30" height="30" fill="#F1EFE8"/><rect x="190" y="220" width="30" height="30" fill="#B4B2A9"/><rect x="220" y="220" width="30" height="30" fill="#D3D1C7"/>
</g>
<rect x="100" y="100" width="90" height="90" fill="none" stroke="#7F77DD" stroke-width="3"/>
<rect x="130" y="130" width="30" height="30" fill="none" stroke="#D85A30" stroke-width="3"/>
<text class="ts" x="145" y="275" text-anchor="middle">centre pixel (u, v) + its 8 neighbours</text>
<line x1="196" y1="145" x2="312" y2="145" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="380" y="75" text-anchor="middle">window = 9 numbers</text>
<g class="c-purple">
<rect x="320" y="85" width="40" height="40" stroke-width="0.5"/><rect x="360" y="85" width="40" height="40" stroke-width="0.5"/><rect x="400" y="85" width="40" height="40" stroke-width="0.5"/>
<rect x="320" y="125" width="40" height="40" stroke-width="0.5"/><rect x="400" y="125" width="40" height="40" stroke-width="0.5"/>
<rect x="320" y="165" width="40" height="40" stroke-width="0.5"/><rect x="360" y="165" width="40" height="40" stroke-width="0.5"/><rect x="400" y="165" width="40" height="40" stroke-width="0.5"/>
<text class="ts" x="340" y="109" text-anchor="middle">170</text><text class="ts" x="380" y="109" text-anchor="middle">130</text><text class="ts" x="420" y="109" text-anchor="middle">60</text>
<text class="ts" x="340" y="149" text-anchor="middle">230</text><text class="ts" x="420" y="149" text-anchor="middle">130</text>
<text class="ts" x="340" y="189" text-anchor="middle">130</text><text class="ts" x="380" y="189" text-anchor="middle">230</text><text class="ts" x="420" y="189" text-anchor="middle">90</text>
</g>
<g class="c-coral"><rect x="360" y="125" width="40" height="40" stroke-width="0.5"/><text class="th" x="380" y="149" text-anchor="middle">40</text></g>
<line x1="446" y1="145" x2="512" y2="145" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="c-purple">
<rect x="520" y="115" width="140" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="590" y="140" text-anchor="middle">fingerprint of</text>
<text class="ts" x="590" y="160" text-anchor="middle">pixel (u, v)</text>
</g>
<text class="ts" x="590" y="200" text-anchor="middle">used to find the same</text>
<text class="ts" x="590" y="218" text-anchor="middle">pixel in the right image</text>
</svg>

<script>
(function(){function post(){parent.postMessage({cvNotesHeight:document.documentElement.scrollHeight},'*')}
addEventListener('load',post);if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);setTimeout(post,300);})();
</script>
</body></html>
