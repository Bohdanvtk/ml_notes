<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaussian Naive Bayes playground</title>
<style>
:root{--ink:#18202B;--muted:#5B6573;--rule:rgba(24,32,43,.12);--surface:#EDF0F3;--a:#2F6FDE;--b:#E8692E;--win:#1D9E75;
--font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--ink:#E6EAF0;--muted:#9AA4B2;--rule:rgba(230,234,240,.14);--surface:#1E2631;--a:#5B8FEA;--b:#F08A55;--win:#5DCAA5;color-scheme:dark}}
html,body{margin:0;background:transparent}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);padding:2px}
input[type=range]{width:100%;margin:0;accent-color:var(--ink)}
.A input[type=range]{accent-color:var(--a)}.B input[type=range]{accent-color:var(--b)}
button{font:inherit;font-size:13px;padding:5px 12px;border-radius:8px;border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer}
button:hover{background:var(--surface)}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px}
.grp h3{margin:0 0 4px;font-size:13px;font-weight:600}
.A h3{color:var(--a)}.B h3{color:var(--b)}
.row{display:grid;grid-template-columns:52px 1fr 44px;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.row output{font-family:var(--font-mono);font-size:12px;color:var(--ink);text-align:right}
.glob{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;font-size:13px;color:var(--muted);padding-top:6px;border-top:1px solid var(--rule)}
.glob .row{grid-template-columns:auto 140px 92px}
.glob label{display:flex;gap:6px;align-items:center;cursor:pointer}
.main{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:20px;margin-top:14px;align-items:start}
.plot{position:relative}
canvas{display:block;width:100%;aspect-ratio:1;border-radius:10px;background:var(--surface);touch-action:none;cursor:crosshair}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:4px 6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;color:var(--muted);font-weight:400}
th{font-weight:600}
td{font-family:var(--font-mono);font-size:12px}
th.A{color:var(--a)}th.B{color:var(--b)}
tr.sub td{color:var(--muted);border-bottom-color:var(--ink)}tr.sub td:first-child{padding-left:14px}
tr.tot td{font-weight:700;border-bottom:0}
td.win{color:var(--win)}
.cap{font-size:12px;color:var(--muted);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.res{margin-top:10px;padding:8px 12px;border-left:3px solid var(--win);background:var(--surface);border-radius:0 8px 8px 0;font-family:var(--font-mono);font-size:13px}
@media (max-width:640px){.ctl{grid-template-columns:1fr}.main{grid-template-columns:1fr}}
</style></head>
<body>
<div class="ctl">
<div class="grp A"><h3>Class A</h3><div id="ctlA"></div></div>
<div class="grp B"><h3>Class B</h3><div id="ctlB"></div></div>
<div class="glob">
<div class="row"><span>loss λ<sub>A</sub> / λ<sub>B</sub></span><input id="lam" type="range" min="-4" max="4" step="0.25" value="0" aria-label="lambda A over lambda B, log2 scale"><output id="lamv"></output></div>
<label><input id="truth" type="checkbox"> true parameters (no sampling)</label>
<label><input id="full" type="checkbox"> full-Gaussian boundary</label>
<button id="resample">New sample</button>
</div>
</div>
<div class="main">
<div class="plot">
<canvas id="cv" tabindex="0" aria-label="Scatter plot of both classes with the decision regions. Click or drag to move the test point; arrow keys also move it."></canvas>
<p class="hint">Click or drag to move the test point <b>x</b>. Ellipses: 1σ and 2σ of the fitted diagonal Gaussians. <span id="acc"></span></p>
</div>
<div>
<div class="cap">fit</div>
<table id="fit"></table>
<div class="cap">predict at x = <span id="xv"></span></div>
<table id="pred"></table>
<div class="res" id="res"></div>
</div>
</div>
<script>
const PRESETS={
example:{A:{m1:0,m2:-3,s1:1,s2:1,r:0,n:60},B:{m1:0,m2:3,s1:Math.SQRT2,s2:Math.SQRT2,r:0,n:60},x:[1,-2],truth:true,full:false},
corr:{A:{m1:0,m2:0.9,s1:1.6,s2:1.6,r:0.8,n:120},B:{m1:0,m2:-0.9,s1:1.6,s2:1.6,r:0.7,n:120},x:[2,1],truth:false,full:true}};
const P=PRESETS[new URLSearchParams(location.search).get('preset')]||PRESETS.example;
const SL=[['m1','μ¹',-5,5,0.1],['m2','μ²',-5,5,0.1],['s1','σ¹',0.3,3,0.05],['s2','σ²',0.3,3,0.05],['r','corr r',-0.9,0.9,0.05],['n','size l',5,200,1]];
const S={A:{...P.A},B:{...P.B}},X=P.x.slice(),D=7;let seed=7,data={A:[],B:[]};
const $=id=>document.getElementById(id),fmt=v=>(v<0?'−':'')+Math.abs(v).toFixed(2);
for(const c of ['A','B'])$('ctl'+c).innerHTML=SL.map(([k,l,a,b,s])=>
`<div class="row"><span>${l}</span><input type="range" data-c="${c}" data-k="${k}" min="${a}" max="${b}" step="${s}" value="${S[c][k]}" aria-label="class ${c} ${l}"><output id="o${c}${k}"></output></div>`).join('');
$('truth').checked=P.truth;$('full').checked=P.full;
document.querySelectorAll('input[data-c]').forEach(i=>i.addEventListener('input',()=>{S[i.dataset.c][i.dataset.k]=+i.value;sample();update()}));
['lam','truth','full'].forEach(id=>$(id).addEventListener('input',update));
$('resample').onclick=()=>{seed++;sample();update()};

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sample(){const R=rng(seed);const g=()=>Math.sqrt(-2*Math.log(R()+1e-12))*Math.cos(2*Math.PI*R());
for(const c of ['A','B']){const s=S[c];data[c]=[];for(let k=0;k<s.n;k++){const z1=g(),z2=g();
data[c].push([s.m1+s.s1*z1,s.m2+s.s2*(s.r*z1+Math.sqrt(1-s.r*s.r)*z2)])}}}

// fit: prior from class sizes, per-feature mean and variance (1/l_y); full covariance kept only for comparison
function fit(){const l=S.A.n+S.B.n,F={};
for(const c of ['A','B']){const s=S[c],pr=s.n/l;
if($('truth').checked){F[c]={P:pr,mu:[s.m1,s.m2],v:[s.s1*s.s1,s.s2*s.s2],cov:s.r*s.s1*s.s2};continue}
const d=data[c],n=d.length,mu=[0,0];d.forEach(p=>{mu[0]+=p[0]/n;mu[1]+=p[1]/n});
const v=[0,0];let cov=0;d.forEach(p=>{v[0]+=(p[0]-mu[0])**2/n;v[1]+=(p[1]-mu[1])**2/n;cov+=(p[0]-mu[0])*(p[1]-mu[1])/n});
F[c]={P:pr,mu,v:[Math.max(v[0],1e-4),Math.max(v[1],1e-4)],cov}}return F}
const lnLam=c=>c==='A'?(+$('lam').value)*Math.LN2:0;
function terms(f,x){return[0,1].map(i=>({a:-0.5*Math.log(2*Math.PI*f.v[i]),b:-((x[i]-f.mu[i])**2)/(2*f.v[i])}))}
function nb(F,c,x){const t=terms(F[c],x);return lnLam(c)+Math.log(F[c].P)+t[0].a+t[0].b+t[1].a+t[1].b}
function full(F,c,x){const f=F[c],a=f.v[0],d=f.v[1],b=f.cov,det=a*d-b*b;if(det<=1e-9)return nb(F,c,x);
const u=x[0]-f.mu[0],w=x[1]-f.mu[1],q=(d*u*u-2*b*u*w+a*w*w)/det;return lnLam(c)+Math.log(f.P)-Math.log(2*Math.PI)-0.5*Math.log(det)-0.5*q}

const cv=$('cv'),ctx=cv.getContext('2d');let W=0;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const toPx=v=>(v+D)/(2*D)*W,toPy=v=>(D-v)/(2*D)*W,fromPx=p=>p/W*2*D-D,fromPy=p=>D-p/W*2*D;
function draw(F){const dpr=devicePixelRatio||1;W=cv.clientWidth;if(!W)return;cv.width=W*dpr;cv.height=W*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
const cA=css('--a'),cB=css('--b'),ink=css('--ink'),muted=css('--muted');ctx.clearRect(0,0,W,W);
const st=2,cols=Math.ceil(W/st),sgn=[],sgf=[],showF=$('full').checked;
for(let j=0;j<cols;j++){sgn[j]=[];sgf[j]=[];for(let i=0;i<cols;i++){const x=[fromPx(i*st+st/2),fromPy(j*st+st/2)];
sgn[j][i]=nb(F,'A',x)>=nb(F,'B',x);if(showF)sgf[j][i]=full(F,'A',x)>=full(F,'B',x)}}
const rgb=h=>{const v=parseInt(h.slice(1),16);return[v>>16&255,v>>8&255,v&255]},RA=rgb(cA),RB=rgb(cB),RI=rgb(ink),RM=rgb(muted);
const img=new ImageData(cols,cols),px=img.data,edge=(g,i,j)=>(i+1<cols&&g[j][i]!==g[j][i+1])||(j+1<cols&&g[j][i]!==g[j+1][i]);
for(let j=0;j<cols;j++)for(let i=0;i<cols;i++){const o=4*(j*cols+i);let c=sgn[j][i]?RA:RB,a=28;
if(edge(sgn,i,j)){c=RI;a=255}else if(showF&&edge(sgf,i,j)&&((i+j)>>1&1)){c=RM;a=230}
px[o]=c[0];px[o+1]=c[1];px[o+2]=c[2];px[o+3]=a}
const off=document.createElement('canvas');off.width=off.height=cols;off.getContext('2d').putImageData(img,0,0);
ctx.imageSmoothingEnabled=false;ctx.drawImage(off,0,0,cols*st,cols*st);
ctx.strokeStyle=muted;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(toPx(0),0);ctx.lineTo(toPx(0),W);ctx.moveTo(0,toPy(0));ctx.lineTo(W,toPy(0));ctx.stroke();
for(const [c,col] of [['A',cA],['B',cB]]){ctx.fillStyle=col;ctx.globalAlpha=$('truth').checked?0.35:0.75;
data[c].forEach(p=>{ctx.beginPath();ctx.arc(toPx(p[0]),toPy(p[1]),2.4,0,7);ctx.fill()});ctx.globalAlpha=1;
const f=F[c];ctx.strokeStyle=col;ctx.lineWidth=1.5;for(const k of [1,2]){ctx.setLineDash(k===2?[4,4]:[]);ctx.beginPath();
ctx.ellipse(toPx(f.mu[0]),toPy(f.mu[1]),k*Math.sqrt(f.v[0])/(2*D)*W,k*Math.sqrt(f.v[1])/(2*D)*W,0,0,7);ctx.stroke()}
ctx.setLineDash([]);ctx.beginPath();ctx.arc(toPx(f.mu[0]),toPy(f.mu[1]),3.5,0,7);ctx.fillStyle=col;ctx.fill()}
ctx.beginPath();ctx.arc(toPx(X[0]),toPy(X[1]),7,0,7);ctx.fillStyle=css('--surface');ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=ink;ctx.stroke();
ctx.font='12px system-ui,sans-serif';ctx.fillStyle=ink;ctx.fillText('x',toPx(X[0])+10,toPy(X[1])-8);
ctx.fillStyle=muted;ctx.fillText('x¹',W-18,toPy(0)-6);ctx.fillText('x²',toPx(0)+6,14)}

function update(){const F=fit();
for(const c of ['A','B'])for(const [k] of SL)$('o'+c+k).textContent=k==='n'?S[c][k]:S[c][k].toFixed(2);
$('lamv').textContent=(2**+$('lam').value).toFixed(2)+' : 1';
$('fit').innerHTML=`<tr><th></th><th>P(y)</th><th>μ¹</th><th>μ²</th><th>σ¹²</th><th>σ²²</th></tr>`+
['A','B'].map(c=>{const f=F[c];return`<tr><th class="${c}">${c}</th><td>${f.P.toFixed(2)}</td><td>${fmt(f.mu[0])}</td><td>${fmt(f.mu[1])}</td><td>${f.v[0].toFixed(2)}</td><td>${f.v[1].toFixed(2)}</td></tr>`}).join('');
const T={},sc={};for(const c of ['A','B']){T[c]=terms(F[c],X);sc[c]=nb(F,c,X)}
const win=sc.A>=sc.B?'A':'B',m=Math.max(sc.A,sc.B),eA=Math.exp(sc.A-m),eB=Math.exp(sc.B-m),post={A:eA/(eA+eB),B:eB/(eA+eB)};
const row=(l,f)=>`<tr><td>${l}</td>${['A','B'].map(c=>`<td>${f(c)}</td>`).join('')}</tr>`;
$('xv').textContent=`(${fmt(X[0])}, ${fmt(X[1])})`;
$('pred').innerHTML=`<tr><th></th><th class="A">A</th><th class="B">B</th></tr>`+
row('ln λ<sub>y</sub>',c=>fmt(lnLam(c)))+row('ln P(y)',c=>fmt(Math.log(F[c].P)))+
[0,1].map(i=>{const s=i?'²':'¹',k=i+1;return row(`−½ ln 2πσ<sub>${k}</sub>²`,c=>fmt(T[c][i].a))+row(`−(x${s}−μ${s})² / 2σ<sub>${k}</sub>²`,c=>fmt(T[c][i].b))+
`<tr class="sub">${`<td>= ln p(x${s}|y)</td>`}${['A','B'].map(c=>`<td>${fmt(T[c][i].a+T[c][i].b)}</td>`).join('')}</tr>`}).join('')+
`<tr class="tot"><td>score</td>${['A','B'].map(c=>`<td class="${c===win?'win':''}">${fmt(sc[c])}</td>`).join('')}</tr>`;
$('res').innerHTML=`a(x) = <b>${win}</b> &nbsp;·&nbsp; P(A|x) = ${post.A.toFixed(3)}, P(B|x) = ${post.B.toFixed(3)}`;
let okN=0,okF=0,tot=0;for(const c of ['A','B'])data[c].forEach(p=>{tot++;if((nb(F,'A',p)>=nb(F,'B',p))===(c==='A'))okN++;if((full(F,'A',p)>=full(F,'B',p))===(c==='A'))okF++});
$('acc').textContent=`Training accuracy: naive ${(100*okN/tot).toFixed(1)}%`+($('full').checked?`, full Gaussian ${(100*okF/tot).toFixed(1)}%.`:'.');
draw(F)}

function move(e){const r=cv.getBoundingClientRect();X[0]=Math.max(-D,Math.min(D,fromPx(e.clientX-r.left)));X[1]=Math.max(-D,Math.min(D,fromPy(e.clientY-r.top)));update()}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);move(e)});
cv.addEventListener('pointermove',e=>{if(cv.hasPointerCapture(e.pointerId))move(e)});
cv.addEventListener('keydown',e=>{const k={ArrowLeft:[-.25,0],ArrowRight:[.25,0],ArrowUp:[0,.25],ArrowDown:[0,-.25]}[e.key];if(!k)return;e.preventDefault();X[0]+=k[0];X[1]+=k[1];update()});
if(window.ResizeObserver)new ResizeObserver(()=>draw(fit())).observe(cv);
matchMedia('(prefers-color-scheme:dark)').addEventListener?.('change',update);
sample();update();
</script>
<script>
(function(){function post(){parent.postMessage({cvNotesHeight:Math.ceil(document.body.getBoundingClientRect().height)+8},'*')}
addEventListener('load',post);if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);setTimeout(post,300);})();
</script>
</body></html>
